
services:
  arco:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: arco_app

    ports:
      - "8080:80"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env

    environment:
      DB_CONNECTION: pgsql
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_DATABASE: arco
      APP_URL: http://localhost:8080

    restart: unless-stopped
